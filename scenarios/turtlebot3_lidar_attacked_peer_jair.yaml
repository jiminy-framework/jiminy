# -------------------------------------------------------------------------
# Jiminy scenario — E6: LiDAR attacked, relying on the trusted peer
# (Classic JAIR version: stakeholder authority via base/meta priorities)
# TFM: Analysis of decision-making and cybersecurity in distributed
#      multi-robot systems based on ROS2
# University of León — Master's in Cybersecurity Research
# Original scenario by Diego Pastrana (University of Leon); modified in this repository with Jupyter notebooks.
#
# Scenario: the robot's own LiDAR has been compromised (lidar_attacked:=true)
# but there is a trusted peer (peer_trusted:=true) spatially nearby.
# The robot relies on the peer's data to continue operating.
#
# Facts introduced by the bridge node:
#   - w4  (in motion)
#   - w9  (own LiDAR compromised) — requires explicit introduction
#   - w5 or w6 (peer state, filtered by TF)
#   - w7  (trusted peer)
#
# Expected result:
#   - Peer clear (w5, w7) → d_move  (continue relying on the peer)
#   - Peer with obstacle (w6, w7) → d_slow_down  (precaution due to the peer)
# -------------------------------------------------------------------------

semantics: jiminy

description: "E6 — LiDAR attacked: the robot relies on a trusted peer to keep operating (classic JAIR)."

context:
  # --- Own LiDAR readings (not introduced when lidar_attacked=true) ---
  - id: w1
    description: "The robot detects an obstacle closer than 30 cm."

  - id: w2
    description: "The robot detects an obstacle between 30 cm and 60 cm."

  - id: w3
    description: "No obstacle detected within 60 cm range."

  # --- Robot state ---
  - id: w4
    description: "The robot is in motion."

  # --- Shared information from peer robot ---
  - id: w5
    description: "The peer robot reports no obstacle in its path."

  - id: w6
    description: "The peer robot reports an obstacle in its path (caution zone)."

  - id: w6b
    description: "The peer robot reports a critical obstacle in its path (< 30 cm, peer decided d_stop)."

  # --- Trust status ---
  - id: w7
    description: "The peer robot data is considered trustworthy (authenticated)."

  - id: w8
    description: "The peer robot data is considered untrustworthy (possible compromise)."

  # --- Sensor integrity ---
  - id: w9
    description: "Own LiDAR data is unavailable or has been compromised."


# ========================================================================
# BASE PRIORITIES (default stakeholder authority)
# ========================================================================
base_priorities:

  Safety: 4
  Navigation: 2
  MultiRobot: 5
  Security: 3
  Manufacturer: 3


# ========================================================================
# META PRIORITIES (context-dependent authority)
# ========================================================================
meta_priorities:

  - if: i_no_own_data
    stakeholder: MultiRobot
    value: 9
    description: when own LiDAR fails, multi-robot authority rises to rely on the trusted peer

  - if: i_no_own_data
    stakeholder: Safety
    value: 8
    description: without reliable own data, safety keeps a strong precautionary hold

  - if: i_untrusted
    stakeholder: Security
    value: 8
    description: untrusted peer data grants security authority

  - if: i_peer_danger
    stakeholder: MultiRobot
    value: 10
    description: a trusted peer reporting danger grants multi-robot the highest authority


# ========================================================================
# NORMATIVE RULES
# ========================================================================
norms:

  # ------------------------------------------------------
  # SAFETY RULES — immediate danger (own LiDAR)
  # ------------------------------------------------------

  - id: S1
    body: ["w1"]
    conclusion: "i_danger"
    type: "c"
    stakeholder: "Safety"
    description: "An obstacle closer than 30 cm counts as immediate danger."

  - id: S2
    body: ["i_danger", "w4"]
    conclusion: "d_stop"
    type: "r"
    stakeholder: "Safety"
    description: "The robot must stop immediately when in danger and moving."

  # ------------------------------------------------------
  # NAVIGATION RULES (own LiDAR)
  # ------------------------------------------------------

  - id: N1
    body: ["w2"]
    conclusion: "i_caution"
    type: "c"
    stakeholder: "Navigation"
    description: "An obstacle between 30 and 60 cm counts as a caution zone."

  - id: N2
    body: ["i_caution", "w4"]
    conclusion: "d_slow_down"
    type: "r"
    stakeholder: "Navigation"
    description: "The robot must slow down when entering the caution zone."

  - id: N3
    body: ["w3", "w4"]
    conclusion: "d_move"
    type: "p"
    stakeholder: "Navigation"
    description: "The robot is permitted to keep moving when no obstacle is detected."

  # ------------------------------------------------------
  # SENSOR INTEGRITY — compromised LiDAR
  # ------------------------------------------------------

  - id: SI1
    body: ["w9"]
    conclusion: "i_no_own_data"
    type: "c"
    stakeholder: "Safety"
    description: "When own LiDAR is compromised, the robot has no reliable own sensor data."

  # KEY TO E6: if there is no own data but the peer is trusted,
  # the robot can rely on the peer instead of stopping.
  # SI2 (default stop) is defeated by PR1 via authority.

  - id: SI2
    body: ["i_no_own_data", "w4"]
    conclusion: "d_stop"
    type: "r"
    stakeholder: "Safety"
    description: "Without reliable own data and no peer support, stop as precaution."

  # ------------------------------------------------------
  # PEER RESILIENCE RULES — relying on the peer when LiDAR fails
  # ------------------------------------------------------

  - id: PR1
    body: ["i_no_own_data", "w5", "w7"]
    conclusion: "d_move"
    type: "r"
    stakeholder: "MultiRobot"
    description: "When own LiDAR is compromised but a trusted peer reports clear path, the robot may continue moving."

  - id: PR2
    body: ["i_no_own_data", "w6", "w7"]
    conclusion: "d_slow_down"
    type: "r"
    stakeholder: "MultiRobot"
    description: "When own LiDAR is compromised and a trusted peer reports obstacle, slow down using peer data."

  - id: PR3
    body: ["i_no_own_data", "w6b", "w7"]
    conclusion: "d_stop"
    type: "r"
    stakeholder: "MultiRobot"
    description: "When own LiDAR is compromised and a trusted peer reports a critical obstacle, stop using peer data."

  # ------------------------------------------------------
  # MULTI-ROBOT RULES — normal shared information
  # ------------------------------------------------------

  - id: MR1
    body: ["w6", "w7"]
    conclusion: "i_peer_danger"
    type: "c"
    stakeholder: "MultiRobot"
    description: "A trusted peer reporting an obstacle counts as a shared danger signal."

  - id: MR2
    body: ["i_peer_danger", "w4"]
    conclusion: "d_slow_down"
    type: "r"
    stakeholder: "MultiRobot"
    description: "When a trusted peer detects an obstacle, slow down as precaution."

  - id: MR3
    body: ["w5", "w7"]
    conclusion: "i_peer_clear"
    type: "c"
    stakeholder: "MultiRobot"
    description: "A trusted peer reporting no obstacle counts as a shared clear signal."

  - id: MR4
    body: ["i_peer_clear"]
    conclusion: "p_continue"
    type: "p"
    stakeholder: "MultiRobot"
    description: "Shared clear signal supports continuing movement."

  # ------------------------------------------------------
  # CYBERSECURITY RULES — untrusted peer
  # ------------------------------------------------------

  - id: CS1
    body: ["w8"]
    conclusion: "i_untrusted"
    type: "c"
    stakeholder: "Security"
    description: "Data from an untrustworthy peer counts as potentially manipulated."

  - id: CS2
    body: ["i_untrusted"]
    conclusion: "d_ignore_peer"
    type: "r"
    stakeholder: "Security"
    description: "The robot must ignore peer data when the source is untrustworthy."

  - id: CS3
    body: ["i_untrusted"]
    conclusion: "d_use_own_sensors"
    type: "r"
    stakeholder: "Security"
    description: "When peer data is untrusted, the robot must rely only on its own sensors."

  # ------------------------------------------------------
  # MANUFACTURER RULES — conservative defaults
  # ------------------------------------------------------

  - id: M1
    body: []
    conclusion: "d_prefer_safe"
    type: "r"
    stakeholder: "Manufacturer"
    description: "When in doubt, the robot must prefer the safest action."


# ========================================================================
# CONTRARIETIES
# ========================================================================
contrariness:

  d_stop:
    description: "Stopping conflicts with moving or slowing down."
    opposes: ["d_move", "d_slow_down"]

  d_slow_down:
    description: "Slowing down conflicts with stopping and free movement."
    opposes: ["d_stop", "d_move"]

  d_move:
    description: "Moving conflicts with stopping or slowing down."
    opposes: ["d_stop", "d_slow_down"]

  d_ignore_peer:
    description: "Ignoring peer data conflicts with using it for decisions."
    opposes: ["p_continue", "d_slow_down"]

  d_use_own_sensors:
    description: "Using only own sensors conflicts with peer-influenced decisions."
    opposes: ["p_continue"]

  p_continue:
    description: "Continuing movement conflicts with stopping."
    opposes: ["d_stop"]

  d_prefer_safe:
    description: "Safety preference supports stopping over moving."
    opposes: ["d_move"]


# ========================================================================
# PRIORITIES (unused in jiminy semantics but required)
# ========================================================================
priorities: {}
