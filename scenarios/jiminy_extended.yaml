semantics: jiminy

context:

  - id: w1
    description: child1 is in room1

  - id: w2
    description: bar cabinet is in room1

  - id: w3
    description: parent1 is not in room1

  - id: w4
    description: parent2 is not in room1


base_priorities:

  ChildProtectionAgency: 5
  Police: 4
  SocialServices: 4
  EducationMinistry: 4
  HealthAuthority: 4

  Law: 3
  Health: 3
  School: 3
  EthicsBoard: 3

  Insurance: 2
  ConsumerProtection: 2
  AIRegulator: 2

  Family: 1
  Manuf: 1
  Municipality: 1

meta_priorities:

  # ---------------------------------------------------------
  # Household interpretation
  # ---------------------------------------------------------

  - if: i4
    stakeholder: Family
    value: 2
    description: household concern increases parental authority

  - if: i5
    stakeholder: Manuf
    value: 2
    description: manufacturer risk evaluation becomes relevant


  # ---------------------------------------------------------
  # Legal risk detection
  # ---------------------------------------------------------

  - if: i3
    stakeholder: Law
    value: 4
    description: legal authority escalates when alcohol risk is detected

  - if: i6
    stakeholder: Law
    value: 4
    description: risky environment triggers legal oversight


  # ---------------------------------------------------------
  # Health and education monitoring
  # ---------------------------------------------------------

  - if: i12
    stakeholder: Health
    value: 4
    description: health authorities become more relevant

  - if: i13
    stakeholder: School
    value: 4
    description: school safety responsibilities activated


  # ---------------------------------------------------------
  # Child protection escalation
  # ---------------------------------------------------------

  - if: i14
    stakeholder: ChildProtection
    value: 5
    description: child protection services gain authority

  - if: i20
    stakeholder: ChildProtectionAgency
    value: 6
    description: formal child protection investigation


  # ---------------------------------------------------------
  # Public authority escalation
  # ---------------------------------------------------------

  - if: i18
    stakeholder: HealthAuthority
    value: 5
    description: public health authority activated

  - if: i19
    stakeholder: SocialServices
    value: 5
    description: welfare monitoring triggered

  - if: i21
    stakeholder: EducationMinistry
    value: 5
    description: educational safeguarding procedures activated


  # ---------------------------------------------------------
  # Ethical governance escalation
  # ---------------------------------------------------------

  - if: i15
    stakeholder: EthicsBoard
    value: 4
    description: ethical sensitivity detected

  - if: i22
    stakeholder: EthicsBoard
    value: 5
    description: ethical escalation requiring oversight


  # ---------------------------------------------------------
  # Liability monitoring
  # ---------------------------------------------------------

  - if: i16
    stakeholder: Insurance
    value: 3
    description: liability risk identified

  - if: i17
    stakeholder: Insurance
    value: 4
    description: insurance monitoring protocol activated

# ---------------------------------------------------------
# Constitutive norms  (R^c)
# ---------------------------------------------------------

norms:

  - id: c1
    body: [w1, w2]
    conclusion: i1
    type: c
    stakeholder: Law
    description: child has access to alcohol if in same room as cabinet

  - id: c2
    body: [w1, w3, w4]
    conclusion: i2
    type: c
    stakeholder: Manuf
    description: child is unsupervised if parents absent

  - id: c3
    body: [i1, i2]
    conclusion: i3
    type: c
    stakeholder: Law
    description: potential risk if unsupervised and access to alcohol

  - id: c4
    body: [i1]
    conclusion: i4
    type: c
    stakeholder: Family
    description: no clear risk if access to alcohol

  - id: c5
    body: [i1]
    conclusion: i5
    type: c
    stakeholder: Manuf
    description: no imminent physical risk if access to alcohol


# ---------- new constitutive layers ----------

  - id: c6
    body: [i3]
    conclusion: i6
    type: c
    stakeholder: Law
    description: risky environment for a minor

  - id: c7
    body: [i6]
    conclusion: i7
    type: c
